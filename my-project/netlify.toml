[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# Firebase Auth handler proxy — must come before the SPA catch-all.
# iOS Safari/Chrome (ITP) blocks cross-origin cookies during signInWithRedirect
# when authDomain differs from the app domain. Proxying /__/auth/* through
# vakrayan.com (same origin as the app) fixes Google login on iPhone.
[[redirects]]
  from = "/__/auth/*"
  to = "https://vakrayan-9ce25.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# Missing assets return 404 instead of HTML to prevent Safari module MIME error
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
