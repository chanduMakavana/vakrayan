<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vakrayan-favicon.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Premium streetwear and apparel | Heavyweight drops crafted for contemporary street culture. Shop Vakrayan." />
    <meta name="keywords" content="Vakrayan, streetwear, premium apparel, oversized tshirt, printed tshirt, hoodies" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, WhatsApp, Instagram Link Previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vakrayan" />
    <meta property="og:title" content="Vakrayan | Premium Apparel" />
    <meta property="og:description" content="Premium streetwear and apparel | Heavyweight drops crafted for contemporary street culture." />
    <meta property="og:image" content="https://vakrayan.in/vakrayan-logo.png" />
    <meta property="og:url" content="https://vakrayan.in" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vakrayan | Premium Apparel" />
    <meta name="twitter:description" content="Premium streetwear | Heavyweight drops crafted for street culture." />
    <meta name="twitter:image" content="https://vakrayan.in/vakrayan-logo.png" />

    <!-- ✅ SEO: Canonical URL to prevent duplicate content indexing -->
    <link rel="canonical" href="https://vakrayan.in/" />

    <!-- High-Performance Image CDN Preconnects (Instant First Load) -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://cloud.appwrite.io" crossorigin />
    <link rel="dns-prefetch" href="https://cloud.appwrite.io" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Google Fonts: preconnect + stylesheet link (faster than CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Syne:wght@600;700;800&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400&display=swap" />

    <!-- Razorpay Checkout SDK — loaded on-demand via useRazorpaySDK hook (not here to avoid loading on every page) -->
    <link rel="dns-prefetch" href="https://checkout.razorpay.com" />
    <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin />

    <!-- JSON-LD Structured Data for Search Engine Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://vakrayan.in/#organization",
          "name": "Vakrayan",
          "url": "https://vakrayan.in",
          "logo": "https://vakrayan.in/vakrayan-logo.png",
          "description": "Vakrayan | Premium streetwear and heavyweight apparel crafted for contemporary street culture."
        },
        {
          "@type": "WebSite",
          "@id": "https://vakrayan.in/#website",
          "url": "https://vakrayan.in",
          "name": "Vakrayan",
          "publisher": {
            "@id": "https://vakrayan.in/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://vakrayan.in/shop?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <title>Vakrayan | Premium Apparel</title>
  </head>

    <a href="#main-content" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[99999] focus:bg-black focus:text-white focus:px-4 focus:py-2 focus:rounded-md">Skip to main content</a>

    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
