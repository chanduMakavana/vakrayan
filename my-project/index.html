    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Asynchronously loaded to prevent render-blocking -->

    <!-- JSON-LD Structured Data for Search Engine Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://vakrayan.in/#organization",
          "name": "Vakrayan",
          "url": "https://vakrayan.in",
          "logo": "https://vakrayan.in/vakrayan-logo.png",
          "description": "Vakrayan | Premium streetwear and heavyweight apparel crafted for contemporary street culture."
        },
        {
          "@type": "WebSite",
          "@id": "https://vakrayan.in/#website",
          "url": "https://vakrayan.in",
          "name": "Vakrayan",
          "publisher": {
            "@id": "https://vakrayan.in/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://vakrayan.in/shop?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
